<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thiết Bị Nhà Máy</title>
    <!-- Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app-container">
        <!-- HEADER -->
        <div class="bg-primary text-white p-3 sticky-top shadow-sm d-flex justify-content-between align-items-center">
            <h6 class="m-0 fw-bold" id="headerTitle"><i class="fa-solid fa-industry me-2"></i>Quản Lý Thiết Bị</h6>
            <button id="btnBack" class="btn btn-sm btn-light d-none" onclick="UI.showPage('page-home')">
                <i class="fa-solid fa-arrow-left"></i> Trở về
            </button>
        </div>

        <!-- 1. HOME PAGE -->
        <div id="page-home" class="page active">
            <div class="input-group mb-3 shadow-sm rounded-3">
                <span class="input-group-text bg-white border-end-0"><i
                        class="fa-solid fa-magnifying-glass text-muted"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0"
                    placeholder="Tìm tên, mã máy...">
            </div>
            <div id="machineList"></div>
        </div>

        <!-- 2. ADD PAGE -->
        <div id="page-add" class="page">
            <form id="addMachineForm">
                <div class="mb-3">
                    <label class="form-label fw-bold small">Hình ảnh máy</label>
                    <input type="file" class="form-control" id="addMachineImage" accept="image/*">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small">Mã QR/Mã Máy (*)</label>
                    <input type="text" class="form-control" id="addMachineCode" placeholder="VD: MAY_DONG_DAI_01"
                        required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small">Tên thiết bị (*)</label>
                    <input type="text" class="form-control" id="addMachineName" placeholder="VD: Máy đóng đai tự động"
                        required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small">Trạng thái</label>
                    <select class="form-select" id="addMachineStatus">
                        <option value="Hoạt động">🟢 Hoạt động tốt</option>
                        <option value="Cần bảo trì">🟡 Cần bảo trì</option>
                        <option value="Hư hỏng">🔴 Đang hỏng</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small">Vị trí</label>
                    <input type="text" class="form-control" id="addMachineLocation" placeholder="VD: Xưởng A">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small">Mô tả kỹ thuật</label>
                    <textarea class="form-control" id="addMachineDesc" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm"><i
                        class="fa-solid fa-floppy-disk me-1"></i> Lưu máy mới</button>
            </form>
        </div>

        <!-- 3. DETAIL PAGE -->
        <div id="page-detail" class="page">
            <div class="card border-0 bg-light mb-3 shadow-sm rounded-3">
                <div id="detailImageContainer" class="d-none">
                    <img id="detailImage" src="" class="card-img-top" style="height: 200px; object-fit: cover;">
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="fw-bold m-0" id="detailName">---</h5>
                        <span id="detailStatus" class="badge bg-success">---</span>
                    </div>
                    <div class="text-muted small mb-1">Mã: <strong id="detailCode">---</strong></div>
                    <div class="text-muted small mb-1">Vị trí: <span id="detailLocation">---</span></div>
                    <div class="text-muted small mb-3">Mô tả: <span id="detailDesc">---</span></div>

                    <button class="btn btn-sm btn-dark w-100" data-bs-toggle="modal" data-bs-target="#qrModal">
                        <i class="fa-solid fa-qrcode me-1"></i> Xem Mã QR Để In
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold m-0"><i class="fa-solid fa-clock-rotate-left me-1"></i> Nhật Ký Vận Hành</h6>
                <button class="btn btn-sm btn-success" data-bs-toggle="modal" data-bs-target="#addLogModal">
                    <i class="fa-solid fa-plus me-1"></i> Ghi Nhật Ký
                </button>
            </div>

            <div id="logsContainer"></div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="UI.showPage('page-home')">
            <i class="fa-solid fa-boxes-stacked"></i>
            <span>Thiết bị</span>
        </div>
        <div class="nav-item" onclick="UI.showPage('page-add')">
            <i class="fa-solid fa-circle-plus"></i>
            <span>Thêm mới</span>
        </div>
    </div>

    <!-- MODAL ADD LOG -->
    <div class="modal fade" id="addLogModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="modal-title fw-bold">Ghi Nhật Ký Sự Cố / Bảo Trì</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addLogForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Tiêu đề sự cố / thao tác</label>
                            <input type="text" class="form-control" id="logTitle" placeholder="VD: Thay dây curoa"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Người ghi</label>
                            <input type="text" class="form-control" id="logUser" value="Thủ kho" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Ảnh đính kèm (nếu có)</label>
                            <input type="file" class="form-control" id="logImage" accept="image/*">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nội dung chi tiết</label>
                            <textarea class="form-control" id="logContent" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Lưu Nhật Ký</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL QR CODE -->
    <div class="modal fade" id="qrModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered text-center">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="modal-title fw-bold">Mã QR Thiết Bị</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="qrcode" class="d-flex justify-content-center my-3"></div>
                    <p class="text-muted small" id="qrUrlText"></p>
                    <button class="btn btn-primary w-100" onclick="window.print()"><i
                            class="fa-solid fa-print me-1"></i> In Mã QR</button>
                </div>
            </div>
        </div>
    </div>

    <!-- External JS Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <!-- App Modular Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/services.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
