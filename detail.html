<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Thiết Bị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER ĐƠN GIẢN (KHÔNG BOTTOM NAV) -->
    <div class="ios-header mb-3 text-center">
        <h6 class="m-0 fw-bold"><i class="fa-solid fa-gears text-warning me-2"></i>Chi Tiết Thiết Bị</h6>
    </div>

    <div class="app-container pb-5">

        <!-- THÔNG TIN MÁY -->
        <div class="ios-card mb-3">
            <div id="detailImageContainer" class="d-none mb-3">
                <img id="detailImage" src="" class="w-100 rounded-3" style="height: 220px; object-fit: cover;">
            </div>
            <div class="d-flex justify-content-between align-items-start mb-2">
                <h4 class="fw-bold m-0 text-light" id="detailName">Đang tải...</h4>
                <span id="detailStatus" class="badge bg-secondary">---</span>
            </div>
            <div class="text-secondary small mb-1">Mã thiết bị: <strong class="text-warning" id="detailCode">---</strong></div>
            <div class="text-secondary small mb-1">Vị trí: <span class="text-light" id="detailLocation">---</span></div>
            <div class="text-secondary small mb-3">Mô tả: <span class="text-light" id="detailDesc">---</span></div>

             
        </div>

        <!-- FORM GHI NHẬT KÝ (ẨN/HIỆN) -->
        <div class="collapse mb-3" id="logFormCollapse">
            <div class="ios-card" style="border: 1px solid #ff9f0a;">
                <h6 class="fw-bold text-warning mb-3"><i class="fa-solid fa-clipboard-check me-1"></i> Thêm Báo Cáo / Nhật Ký</h6>
                <form id="addLogForm">
                    <div class="mb-2">
                        <input type="text" class="form-control" id="logTitle" placeholder="Tiêu đề (VD: Thay nhớt, Hỏng xích)" required>
                    </div>
                    <div class="mb-2">
                        <input type="text" class="form-control" id="logUser" placeholder="Tên người báo cáo" required>
                    </div>
                    <div class="mb-2">
                        <input type="text" class="form-control" id="logImage" placeholder="Link ảnh minh họa (nếu có)">
                    </div>
                    <div class="mb-2">
                        <textarea class="form-control" id="logContent" rows="3" placeholder="Nội dung chi tiết công việc..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-ios-primary w-100 py-2">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Lưu Nhật Ký
                    </button>
                </form>
            </div>
        </div>

        <!-- LỊCH SỬ NHẬT KÝ -->
        <h6 class="fw-bold mb-3 text-secondary px-1"><i class="fa-solid fa-clock-rotate-left me-1"></i> Lịch Sử Vận Hành</h6>
        <div id="logsContainer"></div>

    </div>

    <!-- Scripts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- App Modular Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/services.js"></script>
    
    <script>
        let currentMachineId = null;

        // Lấy ID từ tham số URL (?id=MAY_01)
        const urlParams = new URLSearchParams(window.location.search);
        currentMachineId = urlParams.get('id');

        async function initDetailPage() {
            if (!currentMachineId) {
                alert("Mã máy không hợp lệ!");
                return;
            }

            // Load thông tin máy
            const machine = await MachineService.getMachine(currentMachineId);
            if (machine) {
                document.getElementById("detailName").innerText = machine.name;
                document.getElementById("detailCode").innerText = machine.id;
                document.getElementById("detailLocation").innerText = machine.location || 'Chưa định vị';
                document.getElementById("detailDesc").innerText = machine.desc || 'Không có mô tả';

                const statusEl = document.getElementById("detailStatus");
                statusEl.innerText = machine.status;
                statusEl.className = `badge ${machine.status === 'Hoạt động' ? 'bg-success' : (machine.status === 'Hư hỏng' ? 'bg-danger' : 'bg-warning text-dark')}`;

                if (machine.imageUrl) {
                    document.getElementById("detailImage").src = machine.imageUrl;
                    document.getElementById("detailImageContainer").classList.remove("d-none");
                }
            }

            // Lắng nghe danh sách Nhật ký thời gian thực
            MachineService.subscribeLogs(currentMachineId, logs => {
                const container = document.getElementById('logsContainer');
                if (!logs || logs.length === 0) {
                    container.innerHTML = '<div class="text-secondary small text-center py-3">Chưa có lịch sử bảo trì.</div>';
                    return;
                }

                container.innerHTML = logs.map(l => `
                    <div class="ios-card mb-2" style="background: #2c2c2e;">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <strong class="text-light small">${l.title}</strong>
                            <small class="text-secondary" style="font-size: 0.75rem;">${l.createdAt ? new Date(l.createdAt.toDate()).toLocaleDateString('vi-VN') : 'Vừa xong'}</small>
                        </div>
                        <p class="text-secondary small m-0">${l.content}</p>
                        ${l.imageUrl ? `<img src="${l.imageUrl}" class="w-100 rounded-2 mt-2" style="max-height: 150px; object-fit: cover;">` : ''}
                        <div class="text-end text-secondary mt-1" style="font-size: 0.7rem;">Ghi bởi: ${l.user}</div>
                    </div>
                `).join('');
            });
        }

        // Sự kiện Submit Form Nhật Ký
        document.getElementById("addLogForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button[type='submit']");
            btn.disabled = true;

            try {
                await MachineService.addLog(currentMachineId, {
                    title: document.getElementById("logTitle").value,
                    user: document.getElementById("logUser").value,
                    content: document.getElementById("logContent").value,
                    imageUrl: document.getElementById("logImage").value.trim() || ''
                });

                alert("✅ Đã lưu nhật ký!");
                e.target.reset();
                bootstrap.Collapse.getInstance(document.getElementById('logFormCollapse')).hide();
            } catch (err) {
                alert("❌ Lỗi: " + err.message);
            } finally {
                btn.disabled = false;
            }
        });

        // Chia sẻ Link qua Zalo
        function shareZalo() {
            if (navigator.share) {
                navigator.share({
                    title: 'Thông Tin Thiết Bị',
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('📋 Đã sao chép link! Dán vào Zalo để gửi.');
            }
        }

        window.addEventListener("DOMContentLoaded", initDetailPage);
    </script>
</body>

</html>
